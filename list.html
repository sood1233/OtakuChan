<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>List — Otakuchan</title>
<base href="/">
<link rel="icon" type="image/png" href="img/favicon-32.png" sizes="32x32" id="fav32">
<link rel="icon" type="image/png" href="img/favicon.png" sizes="512x512" id="fav512">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#0EA5E9">
<script>(function(){try{var t=localStorage.getItem('oc-theme');if(t&&t!=="light"){document.documentElement.setAttribute('data-theme',t);}var a=localStorage.getItem('oc-accent');if(a&&a!=="blue")document.documentElement.setAttribute('data-accent',a);}catch(e){}})();</script>
<link rel="preconnect" href="https://pyitivzoqleukuclajrf.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="list">

<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="img/logo-light.png" alt="" width="36" height="36">
          <img class="logo-mark logo-mark-dark" src="img/logo-dark.png" alt="" width="36" height="36">
        </span>
        <span class="wordmark">Otaku<em>chan</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>

  <div id="main">
    <div id="feed">
      <div class="sec-bar">
        <span>List</span>
        <a class="back" href="lists.html">&larr; All Lists</a>
      </div>

      <div id="list-hero"><span class="spinner">Loading&hellip;</span></div>

      <div id="board-hdr" style="display:none;">
        <div class="xtabs" id="list-tabs">
          <button class="xtab active" id="tab-posts" onclick="switchListTab('posts');return false;">Posts</button>
          <button class="xtab" id="tab-members" onclick="switchListTab('members');return false;">Members</button>
        </div>
      </div>

      <div id="list-content"></div>
    </div>

    <div id="sidebar">
      <div class="xsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="side-search" placeholder="Search Otakuchan">
      </div>
      <div class="who-box" id="who-to-follow"></div>
      <div id="ftr" style="padding:0;">
        [<a href="lists.html">&larr; All Lists</a>]
        <br><span style="font-size:10px;color:var(--muted);">&copy; 2026 Otakuchan</span>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/list.js"></script>
</body>
</html>
