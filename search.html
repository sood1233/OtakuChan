<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Otakuchan</title>
<link rel="icon" type="image/png" href="img/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="img/favicon.png" sizes="512x512">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#0EA5E9">
<link rel="preconnect" href="https://pyitivzoqleukuclajrf.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/">
        <span class="badge">
          <svg class="onigiri" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2C15 2 21 13 21 17.5C21 20 17 21.5 12 21.5C7 21.5 3 20 3 17.5C3 13 9 2 12 2Z" fill="#fff"/>
            <rect x="9.3" y="15" width="5.4" height="6" rx="1.4" fill="#0EA5E9"/>
          </svg>
        </span>
        <span class="wordmark">Otaku<em>chan</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>

  <div id="main">
    <div id="feed" style="max-width:600px;">
      <div class="search-topbar">
        <form onsubmit="location.href='search.html?q='+encodeURIComponent(document.getElementById('sp-input').value.trim());return false;">
          <div class="xsearch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="sp-input" placeholder="Search Otakuchan" autocomplete="off">
          </div>
        </form>
      </div>
      <div id="search-tabs" class="xtabs" style="border-bottom:1px solid var(--line);"></div>
      <div id="search-root"><span class="spinner">Type something to search&hellip;</span></div>
    </div>

    <div id="sidebar">
      <div class="who-box" id="who-to-follow"></div>
      <div id="ftr" style="padding:0;">
        [<a href="index.html">&larr; Back to Home</a>]
        <br><span style="font-size:10px;color:#AAA;">&copy; 2026 Otakuchan</span>
      </div>
    </div>
  </div>
</div>

<!-- REPORT MODAL -->
<div class="modal-bg" id="modal-report">
  <div class="modal">
    <a class="modal-close" href="#" onclick="closeReport();return false;">&#10005;</a>
    <h2>Report Post</h2>
    <label>Reason</label>
    <select id="report-reason">
      <option value="illegal">Illegal content</option>
      <option value="spam">Spam</option>
      <option value="doxxing">Doxxing / personal info</option>
      <option value="harassment">Harassment</option>
      <option value="other">Other</option>
    </select>
    <label>Details (optional)</label>
    <textarea id="report-details" rows="3" maxlength="500"></textarea>
    <button class="modal-btn" onclick="submitReport()">Submit Report</button>
  </div>
</div>


<!-- QUOTE POST MODAL -->
<div class="modal-bg" id="modal-quote">
  <div class="modal" style="width:420px;">
    <a class="modal-close" href="#" onclick="closeQuoteModal();return false;">&#10005;</a>
    <h2>Quote Post</h2>
    <div class="errmsg" id="qm-err" style="display:none;margin:0 16px 8px;"></div>
    <div class="qm-body">
      <span class="pf-avatar" id="qm-avatar"></span>
      <textarea id="qm-body" maxlength="4000" placeholder="Add a comment"></textarea>
    </div>
    <div class="qm-preview-wrap" id="qm-preview"></div>
    <button class="modal-btn" id="qm-btn" onclick="submitQuote()">Post</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/search.js"></script>
</body>
</html>
