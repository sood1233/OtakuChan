<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Community — InteractInk</title>
<meta name="description" content="A community on InteractInk — join the conversation.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="InteractInk">
<meta property="og:title" content="Community — InteractInk">
<meta property="og:description" content="A community on InteractInk — join the conversation.">
<meta property="og:image" content="/img/logo-light.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Community — InteractInk">
<meta name="twitter:description" content="A community on InteractInk — join the conversation.">
<meta name="twitter:image" content="/img/logo-light.png">
<link rel="canonical">
<meta property="og:url" content="">
<base href="/">
<link rel="icon" type="image/png" href="img/favicon-32.png" sizes="32x32" id="fav32">
<link rel="icon" type="image/png" href="img/favicon.png" sizes="512x512" id="fav512">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#0EA5E9">
<script>(function(){try{var t=localStorage.getItem('oc-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dim':'light';}if(t&&t!=="light"){document.documentElement.setAttribute('data-theme',t);}var a=localStorage.getItem('oc-accent');if(a&&a!=="blue")document.documentElement.setAttribute('data-accent',a);}catch(e){}})();</script>
<link rel="preconnect" href="https://pyitivzoqleukuclajrf.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="community">

<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="img/logo-light.png" alt="" width="36" height="36">
          <img class="logo-mark logo-mark-dark" src="img/logo-dark.png" alt="" width="36" height="36">
        </span>
        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>

  <div id="main">
    <div id="feed">
      <div class="sec-bar">
        <span>Community</span>
        <a class="back" href="communities.html">&larr; All communities</a>
      </div>

      <div id="community-hero"><span class="spinner">Loading&hellip;</span></div>

      <div id="board-hdr" style="display:none;">
        <div class="xtabs" id="community-tabs">
          <button class="xtab active" id="tab-latest" onclick="switchCommunityTab('latest');return false;">Latest</button>
          <button class="xtab" id="tab-trending" onclick="switchCommunityTab('trending');return false;">Trending</button>
        </div>
      </div>

      <div id="pf-wrap" style="display:none;">
        <div id="pf-box" data-requires-auth style="display:none;">
          <div class="pf-row">
            <span class="pf-avatar" id="cf-avatar"></span>
            <div class="pf-col">
              <div class="errmsg" id="cf-err" style="display:none;"></div>
              <textarea id="cf-body" maxlength="500" placeholder="Post in this community"></textarea>
              <div id="cf-fp" class="fp"></div>
            </div>
          </div>
          <div class="pf-toolbar">
            <div class="pf-icons">
              <button type="button" class="pf-ic" title="Media" aria-label="Media" onclick="document.getElementById('cf-file').click();return false;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10.5" r="1.6"/><path d="m4 17 5-5 3.5 3.5L17 11l3 3"/></svg>
              </button>
              <button type="button" class="pf-ic" title="GIF" aria-label="GIF" onclick="openGifPicker('cf');return false;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 9.5v5M13.5 9.5h-2.2a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1H13v-2h-1M16 14.5v-5h2.4M16 12h1.8"/></svg>
              </button>
              <button type="button" class="pf-ic" title="Emoji" aria-label="Emoji" onclick="toggleEmojiPicker('cf', this);return false;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8.5 10h.01M15.5 10h.01M8 14.5c1 1.2 2.3 1.8 4 1.8s3-.6 4-1.8"/></svg>
              </button>
              <input type="file" id="cf-file" accept="image/*,video/*" style="display:none;">
            </div>
            <input type="submit" id="cf-btn" class="pf-btn" value="Post" onclick="submitCommunityPost();return false;" disabled>
          </div>
          <span id="cf-st" style="font-size:11px;color:var(--muted);"></span>
        </div>
        <div class="post-login-gate" id="cf-join-gate" style="display:none;">
          Join this community to post in it.
        </div>
        <div class="post-login-gate" data-requires-anon style="display:none;">
          You need an account to post. <a href="login.html">Log in</a> or <a href="signup.html">sign up</a> — it takes a minute.
        </div>
      </div>

      <div id="feed-posts"></div>
    </div>

    <div id="sidebar">
      <div class="xsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="side-search" placeholder="Search InteractInk">
      </div>
      <div class="who-box" id="my-communities"></div>
      <div class="who-box" id="who-to-follow"></div>
      <div id="ftr" style="padding:0;">
        [<a href="communities.html">&larr; All communities</a>]
        <br><span style="font-size:10px;color:var(--muted);">&copy; 2026 InteractInk</span>
      </div>
    </div>
  </div>
</div>

<!-- REPORT MODAL -->
<div class="modal-bg" id="modal-report">
  <div class="modal">
    <a class="modal-close" href="#" onclick="closeReport();return false;">&#10005;</a>
    <h2>Report Post</h2>
    <label>Reason</label>
    <select id="report-reason">
      <option value="illegal">Illegal content</option>
      <option value="spam">Spam</option>
      <option value="doxxing">Doxxing / personal info</option>
      <option value="harassment">Harassment</option>
      <option value="other">Other</option>
    </select>
    <label>Details (optional)</label>
    <textarea id="report-details" rows="3" maxlength="500"></textarea>
    <button class="modal-btn" onclick="submitReport()">Submit Report</button>
  </div>
</div>

<!-- QUOTE POST MODAL -->
<div class="modal-bg" id="modal-quote">
  <div class="modal" style="width:420px;">
    <a class="modal-close" href="#" onclick="closeQuoteModal();return false;">&#10005;</a>
    <h2>Quote Post</h2>
    <div class="errmsg" id="qm-err" style="display:none;margin:0 16px 8px;"></div>
    <div class="qm-body">
      <span class="pf-avatar" id="qm-avatar"></span>
      <textarea id="qm-body" maxlength="500" placeholder="Add a comment"></textarea>
    </div>
    <div class="qm-preview-wrap" id="qm-preview"></div>
    <div class="qm-foot"><span class="qm-count" id="qm-count">500</span></div>
    <button class="modal-btn" id="qm-btn" onclick="submitQuote()">Post</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/video-player.js"></script>
<script src="js/auth.js"></script>
<script src="js/community.js"></script>
</body>
</html>
