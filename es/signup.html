<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Registrarse — InteractInk</title>
<meta name="description" content="Crea una cuenta de InteractInk — toma solo un minuto.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="InteractInk">
<meta property="og:title" content="Registrarse — InteractInk">
<meta property="og:description" content="Crea una cuenta de InteractInk — toma solo un minuto.">
<meta property="og:image" content="/img/logo-light.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Registrarse — InteractInk">
<meta name="twitter:description" content="Crea una cuenta de InteractInk — toma solo un minuto.">
<meta name="twitter:image" content="/img/logo-light.png">
<link rel="canonical" href="https://otakuchan.vercel.app/es/signup">
<meta property="og:url" content="https://otakuchan.vercel.app/es/signup">
<link rel="alternate" hreflang="en" href="https://otakuchan.vercel.app/signup">
<link rel="alternate" hreflang="es" href="https://otakuchan.vercel.app/es/signup">
<link rel="alternate" hreflang="x-default" href="https://otakuchan.vercel.app/signup">
<base href="/">
<link rel="icon" type="image/png" href="img/favicon-32.png" sizes="32x32" id="fav32">
<link rel="icon" type="image/png" href="img/favicon.png" sizes="512x512" id="fav512">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#16A34A">
<script>(function(){try{var t=localStorage.getItem('oc-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}if(t&&t!=="light"){document.documentElement.setAttribute('data-theme',t);}var a=localStorage.getItem('oc-accent');if(a&&a!=="green")document.documentElement.setAttribute('data-accent',a);}catch(e){}})();</script>
<link rel="preconnect" href="https://pyitivzoqleukuclajrf.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/es">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="img/logo-light.png" alt="InteractInk logo" width="36" height="36">
          <img class="logo-mark logo-mark-dark" src="img/logo-dark.png" alt="InteractInk logo" width="36" height="36">
        </span>
        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>
  <div class="auth-wrap">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-card-logo" href="/es">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="img/logo-light.png" alt="InteractInk logo" width="28" height="28">
          <img class="logo-mark logo-mark-dark" src="img/logo-dark.png" alt="InteractInk logo" width="28" height="28">
        </span>
        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <h1 data-i18n="auth.signUp">Registrarse</h1>
      <p class="auth-sub" data-i18n="auth.signUpSub">Crea tu cuenta — solo toma un minuto.</p>
      <div class="auth-body">
        <div class="errmsg" id="su-err" style="display:none;"></div>
        <form id="su-form" onsubmit="doSignUp(event)">
          <div class="auth-field">
            <label for="su-username" data-i18n="auth.username">Usuario</label>
            <div class="auth-input-wrap">
              <span class="auth-fi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
              <input type="text" id="su-username" required maxlength="20" autocomplete="username" placeholder="tunombre">
            </div>
            <span class="auth-hint">3–20 caracteres: letras, números, guion bajo.</span>
          </div>
          <div class="auth-field">
            <label for="su-email" data-i18n="auth.email">Correo electrónico</label>
            <div class="auth-input-wrap">
              <span class="auth-fi"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg></span>
              <input type="email" id="su-email" required autocomplete="email" placeholder="tu@ejemplo.com">
            </div>
          </div>
          <div class="auth-field">
            <label for="su-password" data-i18n="auth.password">Contraseña</label>
            <div class="auth-input-wrap">
              <span class="auth-fi"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
              <input type="password" id="su-password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
              <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" onclick="togglePwVis('su-password', this)">
                <svg class="eye-on" viewBox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
              </button>
            </div>
            <span class="auth-hint">Al menos 8 caracteres.</span>
          </div>
          <input type="submit" id="su-btn" class="auth-submit" value="Registrarse" data-i18n-value="auth.signUp">
        </form>



        <div class="auth-switch" id="su-switch"><span data-i18n="auth.haveAccount">¿Ya tienes una cuenta?</span> <a href="/es/login" data-i18n="nav.logIn">Iniciar sesión</a></div>
        <div class="auth-legal" id="su-legal" data-i18n="auth.legal">Al registrarte aceptas las <a href="/es/rules">normas</a> de InteractInk.</div>
      </div>
    </div>
  </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/video-player.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
