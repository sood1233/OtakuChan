<!DOCTYPE html>

<link rel="icon" type="image/png" href="img/favicon-32.png" sizes="32x32" id="fav32">
<link rel="icon" type="image/png" href="img/favicon.png" sizes="512x512" id="fav512">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#0EA5E9">
<script>(function(){try{var t=localStorage.getItem('oc-theme');if(t&&t!=="light"){document.documentElement.setAttribute('data-theme',t);}var a=localStorage.getItem('oc-accent');if(a&&a!=="blue")document.documentElement.setAttribute('data-accent',a);}catch(e){}})();</script>
<link rel="preconnect" href="https://pyitivzoqleukuclajrf.supabase.co">

<body>

<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="img/logo-light.png" alt="" width="36" height="36">
          <img class="logo-mark logo-mark-dark" src="img/logo-dark.png" alt="" width="36" height="36">
        </span>
        <span class="wordmark">Otaku<em>chan</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>

  <div id="main">
    <div id="feed" style="max-width:600px;">
      <div class="sec-bar" id="fl-hdr">
        <a class="ep-back" href="index.html" id="fl-back">&larr;</a>
        <div class="sec-bar-title">
          <b id="fl-name">&nbsp;</b>
          <span class="sub" id="fl-handle"></span>
        </div>
      </div>
      <div id="fl-tabs" class="xtabs" style="border-bottom:1px solid var(--line);"></div>
      <div id="followlist-root"><span class="spinner">Loading&hellip;</span></div>
    </div>

    <div id="sidebar">
      <div class="xsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="side-search" placeholder="Search InteractInk">
      </div>
      <div class="who-box" id="who-to-follow"></div>
      <div id="ftr" style="padding:0;">
        [<a href="index.html">&larr; Back to Home</a>]
        <br><span style="font-size:10px;color:var(--muted);">&copy; 2026 InteractInk</span>
