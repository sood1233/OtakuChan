<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thread — Otakuchan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="hdr">
  <a class="logo" href="/">Otaku<em>chan</em></a>
  <nav>
    <a href="index.html">[Home]</a>
    <a href="rules.html">[Rules]</a>
    <a href="rules.html#faq">[FAQ]</a>
  </nav>
</div>

<div id="board-hdr">
  <h1>Thread</h1>
  <p>/all/ &mdash; Global Board</p>
</div>

<div id="main" style="max-width:820px;">
  <div id="feed" style="flex:1;">
    <div class="sec-bar">Viewing Thread <a class="back" href="index.html">&larr; Back to board</a></div>
    <div id="thread-root"><span class="spinner">Loading thread&hellip;</span></div>
  </div>
</div>

<hr style="border:none;border-top:1px solid var(--div);margin:0 12px;">
<div id="ftr">
  [<a href="index.html">&larr; Back to /all/</a>]
  &nbsp;&mdash;&nbsp;
  Images and comments are the responsibility of the poster.
  <br><span style="font-size:10px;color:#AAA;">&copy; 2026 Otakuchan &mdash; <a href="rules.html">Rules</a> &mdash; <a href="rules.html#dmca">DMCA</a></span>
</div>

<!-- REPORT MODAL -->
<div class="modal-bg" id="modal-report">
  <div class="modal">
    <a class="modal-close" href="#" onclick="closeReport();return false;">&#10005;</a>
    <h2>Report Post</h2>
    <label>Reason</label>
    <select id="report-reason">
      <option value="illegal">Illegal content</option>
      <option value="spam">Spam</option>
      <option value="doxxing">Doxxing / personal info</option>
      <option value="harassment">Harassment</option>
      <option value="other">Other</option>
    </select>
    <label>Details (optional)</label>
    <textarea id="report-details" rows="3" maxlength="500"></textarea>
    <button class="modal-btn" onclick="submitReport()">Submit Report</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/thread.js"></script>
</body>
</html>
