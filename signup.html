<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Otakuchan</title>
<link rel="icon" type="image/png" href="img/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="img/favicon.png" sizes="512x512">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#8F2611">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="hdr">
  <a class="logo" href="/">
    <svg class="onigiri" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 2C15 2 21 13 21 17.5C21 20 17 21.5 12 21.5C7 21.5 3 20 3 17.5C3 13 9 2 12 2Z" fill="#fff"/>
      <rect x="9.3" y="15" width="5.4" height="6" rx="1.4" fill="var(--mustard)"/>
    </svg>
    Otaku<em>chan</em>
  </a>
  <nav>
    <a href="index.html">[Home]</a>
    <a href="rules.html">[Rules]</a>
    <a href="rules.html#faq">[FAQ]</a>
    <span id="auth-area" class="auth-area"></span>
  </nav>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <b>Sign Up</b>
    <div class="auth-body">
      <div class="auth-ok" id="su-ok" style="display:none;">
        Almost there! Check your email to confirm your account, then log in.
      </div>
      <div class="errmsg" id="su-err" style="display:none;"></div>
      <form id="su-form" onsubmit="doSignUp(event)">
        <div class="auth-field">
          <label>Username</label>
          <input type="text" id="su-username" required maxlength="20" autocomplete="username">
          <span class="auth-hint">3–20 characters: letters, numbers, underscore.</span>
        </div>
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="su-email" required autocomplete="email">
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="su-password" required minlength="8" autocomplete="new-password">
          <span class="auth-hint">At least 8 characters.</span>
        </div>
        <input type="submit" id="su-btn" class="auth-submit" value="Sign Up">
      </form>
      <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>
</div>

<hr style="border:none;border-top:1px solid var(--div);margin:0 12px;">
<div id="ftr">
  [<a href="index.html">&larr; Back to /all/</a>]
  <br><span style="font-size:10px;color:#AAA;">&copy; 2026 Otakuchan</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
