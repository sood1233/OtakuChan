<body data-page="editarticle">

<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="img/logo-light.png" alt="InteractInk logo" width="36" height="36">
          <img class="logo-mark logo-mark-dark" src="img/logo-dark.png" alt="InteractInk logo" width="36" height="36">
        </span>
        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>

  <div id="main">
    <div id="feed" style="max-width:680px;">
      <div class="sec-bar" id="ea-hdr">
        <a class="ep-back" href="articles.html">&larr;</a>
        <div>
          <h1 id="ea-title-hdr">Write an Article</h1>
        </div>
      </div>

      <div id="editarticle-root">
        <div class="errmsg" id="ea-err" style="display:none;margin:12px 16px 0;"></div>
        <div class="ea-field">
          <label for="ea-title">Title</label>
          <input type="text" id="ea-title" maxlength="120" placeholder="Give your article a title">
        </div>
        <div class="ea-field">
          <label for="ea-cover">Cover image URL (optional)</label>
          <input type="text" id="ea-cover" maxlength="500" placeholder="https://…">
        </div>
        <div class="ea-field">
          <label for="ea-body">Article</label>
          <textarea id="ea-body" rows="16" placeholder="Write your article here…"></textarea>
        </div>
        <div class="ea-actions">
          <button type="button" class="modal-btn" id="ea-submit" onclick="submitArticle()">Publish</button>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div class="who-box" id="who-to-follow"></div>
      <div id="ftr" style="padding:0;">
        [<a href="articles.html">&larr; All Articles</a>]

      </div>
    </div>
  </div>
</div>
